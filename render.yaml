services:
  - type: web
    name: yojnasetu-backend
    runtime: python
    plan: free
    rootDir: "yojna setu/02backend"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "YojnaSetu API"
      - key: API_V1_STR
        value: "/api/v1"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: "auto"
      - key: GEMINI_MODEL
        value: "gemini-flash-latest"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: "370546184305-2kusbrn1a3t2hd8cu5ap16vmsk2ci066.apps.googleusercontent.com"
